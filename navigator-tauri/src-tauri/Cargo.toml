[package]
name = "nebula-navigator"
version = "0.1.0"
description = "Nebula Navigator -- Tauri front-end over the Python nebula backend"
authors = ["Grant Giesbrecht"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# By default Tauri runs in production; `tauri dev` enables this automatically.
custom-protocol = ["tauri/custom-protocol"]
