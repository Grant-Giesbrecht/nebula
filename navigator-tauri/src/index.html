<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nebula Navigator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <div class="titlebar">
      <div class="title" id="wtitle">Nebula Navigator</div>
      <button class="theme-toggle" id="themeBtn">◐ Theme</button>
    </div>

    <div class="body">
      <aside class="rail" id="rail">
        <div class="arc-bar">
          <select id="archiveSel" title="Active archive"></select>
          <button class="abtn" id="openArchive" title="Open another archive…">+</button>
          <button class="abtn" id="closeArchive" title="Close this archive">✕</button>
        </div>
        <div class="rail-head"><span>Sessions</span><span id="sessCount"></span></div>
        <div class="search-row">
          <span class="s-ico">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
          </span>
          <input id="sessSearch" placeholder="Search sessions…" spellcheck="false" />
          <button class="s-x hidden" id="sessSearchClear" title="Clear">✕</button>
          <button class="abtn" id="sessCfgBtn" title="Search options">⚙</button>
          <div class="pop hidden" id="sessCfg">
          <div class="pop-h">Search in</div>
          <label class="check"><input type="checkbox" id="sfTitle" checked /> Titles</label>
          <label class="check"><input type="checkbox" id="sfId" checked /> IDs</label>
          <label class="check"><input type="checkbox" id="sfTag" checked /> Tags</label>
          <label class="check"><input type="checkbox" id="sfUserTag" checked /> Your tags</label>
          <div class="pop-h">Show sessions</div>
          <label class="check"><input type="checkbox" id="ssOpen" checked /> Open</label>
          <label class="check"><input type="checkbox" id="ssClosed" checked /> Closed</label>
          <label class="check"><input type="checkbox" id="ssCrashed" checked /> Crashed</label>
          <div class="pop-sep"></div>
          <label class="check"><input type="checkbox" id="sqClean" checked /> Clean</label>
          <label class="check"><input type="checkbox" id="sqDirty" checked /> Dirty <span class="hint">(has problems)</span></label>
          </div>
        </div>
        <div class="session-list" id="sessionList"></div>
      </aside>

      <div class="splitter v" id="splitRail" title="Drag to resize"></div>

      <section class="main">
        <div class="toolbar">
          <button class="tbtn" id="refresh" title="Reload archive &amp; session info  (Ctrl-R)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
          </button>
          <div class="seg">
            <button class="tbtn on" id="viewList" title="List view">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            </button>
            <button class="tbtn" id="viewGrid" title="Grid view">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            </button>
          </div>
          <div class="pop-wrap">
            <button class="tbtn" id="sortBtn" title="Sort &amp; filter files">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16"/><polyline points="4 17 7 20 10 17"/><path d="M17 20V4"/><polyline points="14 7 17 4 20 7"/></svg>
              Sort
            </button>
            <div class="pop anchored hidden" id="sortCfg">
              <div class="pop-h">Sort by</div>
              <label class="check"><input type="radio" name="sortby" id="sortDate" checked /> Date created</label>
              <label class="check"><input type="radio" name="sortby" id="sortTitle" /> Title</label>
              <label class="check"><input type="radio" name="sortby" id="sortStatus" /> File status</label>
              <div class="pop-h">Order</div>
              <label class="check"><input type="radio" name="sortdir" id="sortDesc" checked /> <span id="sortDescLbl">Newest first</span></label>
              <label class="check"><input type="radio" name="sortdir" id="sortAsc" /> <span id="sortAscLbl">Oldest first</span></label>
              <div class="pop-h">Show</div>
              <label class="check"><input type="checkbox" id="fltPaired" checked /> OK</label>
              <label class="check"><input type="checkbox" id="fltDrifted" checked /> Modified</label>
              <label class="check"><input type="checkbox" id="fltOrphan" checked /> No metadata</label>
              <label class="check"><input type="checkbox" id="fltStray" checked /> Data missing</label>
            </div>
          </div>
          <div class="vdiv"></div>
          <label class="check"><input type="checkbox" id="verify" /> Verify checksums</label>
          <label class="check"><input type="checkbox" id="meta" checked /> Show metadata</label>
          <div class="vdiv"></div>
          <button class="tbtn" id="arcBtn" title="Archive management">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="5" rx="1"/><path d="M4 9v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9"/><line x1="10" y1="13" x2="14" y2="13"/></svg>
            Archive
          </button>
          <button class="tbtn" id="sessInfoBtn" title="Session info — session.yaml  (Ctrl-Shift-S)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            Session info
          </button>
          <div class="spacer"></div>
          <button class="btn-primary" id="importBtn" title="Import files…  (Ctrl-Shift-I)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Import files…
          </button>
        </div>

        <div class="search-row wide">
          <span class="s-ico">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
          </span>
          <input id="itemSearch" placeholder="Search artefacts in this archive — filenames, tags, origin…" spellcheck="false" />
          <button class="s-x hidden" id="itemSearchClear" title="Clear search">✕</button>
          <button class="abtn wide-btn" id="itemCfgBtn" title="Advanced search options">⚙ Advanced</button>
          <div class="pop right hidden" id="itemCfg">
          <div class="pop-h">Search in</div>
          <label class="check"><input type="checkbox" id="ifName" checked /> Filenames</label>
          <label class="check"><input type="checkbox" id="ifTag" checked /> Session Tags </label>
          <label class="check"><input type="checkbox" id="ifOrigin" checked /> Origin / source</label>
          <label class="check"><input type="checkbox" id="ifSession" checked /> Session ID &amp; title</label>
          <label class="check"><input type="checkbox" id="ifUserTags" checked /> Your tags</label>
          <label class="check"><input type="checkbox" id="ifComments" checked /> Your comments</label>
          <div class="pop-h">Created between</div>
          <label class="check"><input type="checkbox" id="ifDates" /> Filter by date</label>
          <div class="pop-dates" id="ifDateFields">
            <div class="field"><label>From</label><input id="ifFrom" placeholder="YYYY/MM/DD" spellcheck="false" /></div>
            <div class="field"><label>To</label><input id="ifTo" placeholder="YYYY/MM/DD" spellcheck="false" /></div>
          </div>
          <div class="pop-actions"><button class="dbtn ghost" id="ifReset">Reset dates</button></div>
          </div>
        </div>

        <div class="item-area" id="itemArea"><div class="empty">Open an archive to begin.</div></div>

        <div class="details">
          <div class="det-actions">
            <button class="lbtn" id="openArt" title="Open in the default app  (Ctrl-O)" disabled>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              Open artefact
            </button>
            <button class="lbtn" id="openSc" title="Show the sidecar panel  (Ctrl-Shift-M)" disabled>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
              Open sidecar
            </button>
            <button class="lbtn" id="resealBtn" title="Re-record the checksum after an intended edit" disabled>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              Reseal
            </button>
            <button class="lbtn" id="adoptBtn" title="Write a sidecar for this untracked file" disabled>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
              Write sidecar
            </button>
            <button class="lbtn danger" id="delBtn" title="Move this artefact to the session's .trash/" disabled>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              Delete
            </button>
            <button class="lbtn" id="editSc" disabled>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
              Open sidecar in editor
            </button>
          </div>
          <div class="det-prov" id="detProv"></div>
          <div class="det-text" id="detText">Select an item to see its provenance.</div>
        </div>
      </section>

      <div class="splitter v hidden" id="splitDock" title="Drag to resize"></div>

      <aside class="dock hidden" id="dock">
        <section class="panel hidden" id="sessPanel">
          <div class="p-head">
            <span class="t" id="sessTitle">Session</span>
            <button class="p-btn" id="sessRaw" title="Show session.yaml source">{ }</button>
            <button class="p-btn" id="sessClose" title="Hide">✕</button>
          </div>
          <div class="p-body" id="sessBody"></div>
        </section>

        <div class="splitter h hidden" id="splitDockRows" title="Drag to resize"></div>

        <section class="panel hidden" id="scPanel">
          <div class="p-head">
            <span class="t" id="scTitle">Sidecar</span>
            <button class="p-btn" id="scRaw" title="Show raw JSON">{ }</button>
            <button class="p-btn" id="scClose" title="Hide">✕</button>
          </div>
          <div class="p-body" id="scBody"></div>
        </section>
      </aside>
    </div>

    <div class="statusbar" id="statusbar">No archive open</div>
  </div>

  <div class="dropzone" id="dropZone">
    <div class="dz-card">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <div class="dz-t">Drop files to import</div>
      <div class="dz-s" id="dzSub"></div>
    </div>
  </div>

  <div class="scrim" id="scrim">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgHead">
      <div class="dlg-head" id="dlgHead">Import files</div>
      <div class="dlg-body">
        <div class="dlg-arc">into <b id="dlgArchive"></b></div>
        <div class="filelist" id="dlgFiles"></div>
        <div>
          <label class="radio"><input type="radio" name="mode" value="existing" id="modeExisting" checked /> Add to existing session</label>
          <div class="field indent" style="margin-top:6px">
            <label>Session</label>
            <select id="dlgSession"></select>
          </div>
          <label class="radio" style="margin-top:8px"><input type="radio" name="mode" value="new" id="modeNew" /> Create a new session</label>
          <div class="field indent" id="newFields" style="margin-top:6px; gap:8px; display:none">
            <div class="field"><label>Tags</label><input id="dlgTags" placeholder="comma-separated, optional" /></div>
            <div class="field"><label>Description</label><input id="dlgDesc" placeholder="session description, optional" /></div>
          </div>
        </div>
        <div class="field"><label>Origin</label><input id="dlgOrigin" placeholder="where did these come from? e.g. emailed by Jane" /></div>
        <div class="field">
          <label>Derived from <span class="lbl-hint">optional — comma-separated refs</span></label>
          <input id="dlgDerived" list="dlgDerivedList" spellcheck="false"
                 placeholder="raw.csv,  S-0152/raw.csv,  postdoc|S-0152/raw.csv" />
          <datalist id="dlgDerivedList"></datalist>
          <div class="reflist" id="dlgRefs"></div>
        </div>
      </div>
      <div class="dlg-actions">
        <button class="dbtn ghost" id="dlgCancel">Cancel</button>
        <button class="dbtn fill" id="dlgImport">Import</button>
      </div>
    </div>
  </div>

  <div class="scrim" id="arcScrim">
    <div class="dialog wide" role="dialog" aria-modal="true" aria-labelledby="arcHead">
      <div class="dlg-head row" id="arcHead">
        <span>Archive management</span>
        <button class="p-btn" id="arcClose" title="Close">✕</button>
      </div>
      <div class="dlg-body scroll" id="arcBody"></div>
    </div>
  </div>

  <div class="scrim" id="cfmScrim">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="cfmHead">
      <div class="dlg-head" id="cfmHead">Are you sure?</div>
      <div class="dlg-body"><div class="cfm-body" id="cfmBody"></div></div>
      <div class="dlg-actions">
        <button class="dbtn ghost" id="cfmCancel">Cancel</button>
        <button class="dbtn fill danger" id="cfmOk">Confirm</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="main.js"></script>
</body>
</html>
