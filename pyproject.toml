[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nebula-archive"
version = "0.1.0"
description = "Provenance and session organization for measurement scripts and data"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
nebula = "nebula.cli:main"

# The Navigator GUI is the Tauri app in navigator-tauri/, not a Python
# entry point -- it ships as a native bundle with the Python bridge
# (nebula.navigator.api) frozen inside. See navigator-tauri/README.md.

[tool.setuptools.packages.find]
where = ["src"]
